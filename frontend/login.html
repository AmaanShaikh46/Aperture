<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aperture.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/bootstrap-overrides.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Sign In — APERTURE</title>
  </head>
  <body>
    <div id="app">
      <div class="auth-page">
        <div class="auth-brand">
          <i class="bi bi-aperture"></i>
          <h1>APERTURE</h1>
        </div>
        <div class="auth-card card">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Sign In</h2>
            <form id="login-form">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required autocomplete="email" />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required autocomplete="current-password" />
              </div>
              <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100 btn-lg" id="login-btn">
                <span id="login-btn-text">Sign In</span>
                <span id="login-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>
            <div class="auth-links">
              <a href="forgot-password.html">Forgot password?</a>
              <br />
              <span>Don't have an account? <a href="register.html">Sign up</a></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { auth } from './js/services/auth-service.js';
      import { initTheme, showToast } from './js/utils.js';
      import { USE_MOCK_API } from './js/config.js';

      initTheme();

      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('login-btn-text');
      const btnSpinner = document.getElementById('login-btn-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('d-none');
        btn.disabled = true;
        btnText.textContent = 'Signing in...';
        btnSpinner.classList.remove('d-none');

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          if (USE_MOCK_API) {
            // Mock mode: just redirect to app
            showToast('Signed in (mock mode)', 'success');
            setTimeout(() => { window.location.href = 'app.html'; }, 500);
            return;
          }
          await auth.signIn(email, password);
          window.location.href = 'app.html';
        } catch (err) {
          errorEl.textContent = err.message || 'Sign in failed. Please check your credentials.';
          errorEl.classList.remove('d-none');
          btn.disabled = false;
          btnText.textContent = 'Sign In';
          btnSpinner.classList.add('d-none');
        }
      });
    </script>
  </body>
</html>
