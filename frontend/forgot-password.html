<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aperture.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/bootstrap-overrides.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Forgot Password — APERTURE</title>
  </head>
  <body>
    <div id="app">
      <div class="auth-page">
        <div class="auth-brand">
          <i class="bi bi-aperture"></i>
          <h1>APERTURE</h1>
        </div>
        <div class="auth-card card">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Forgot Password</h2>
            <p class="text-muted mb-3">Enter your email and we'll send you a link to reset your password.</p>
            <form id="forgot-form">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required autocomplete="email" />
              </div>
              <div id="forgot-error" class="alert alert-danger d-none" role="alert"></div>
              <div id="forgot-success" class="alert alert-success d-none" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100 btn-lg" id="forgot-btn">
                <span id="forgot-btn-text">Send Reset Link</span>
                <span id="forgot-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>
            <div class="auth-links">
              <a href="login.html">Back to sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { auth } from './js/services/auth-service.js';
      import { initTheme } from './js/utils.js';
      import { USE_MOCK_API } from './js/config.js';

      initTheme();

      const form = document.getElementById('forgot-form');
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      const btn = document.getElementById('forgot-btn');
      const btnText = document.getElementById('forgot-btn-text');
      const btnSpinner = document.getElementById('forgot-btn-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('d-none');
        successEl.classList.add('d-none');
        btn.disabled = true;
        btnText.textContent = 'Sending...';
        btnSpinner.classList.remove('d-none');

        const email = document.getElementById('email').value;

        try {
          if (USE_MOCK_API) {
            successEl.textContent = 'Reset link sent (mock mode). Check your email.';
            successEl.classList.remove('d-none');
            btn.disabled = false;
            btnText.textContent = 'Send Reset Link';
            btnSpinner.classList.add('d-none');
            return;
          }
          await auth.resetPassword(email);
          successEl.textContent = 'Reset link sent. Check your email.';
          successEl.classList.remove('d-none');
          btn.disabled = false;
          btnText.textContent = 'Send Reset Link';
          btnSpinner.classList.add('d-none');
        } catch (err) {
          errorEl.textContent = err.message || 'Could not send reset link.';
          errorEl.classList.remove('d-none');
          btn.disabled = false;
          btnText.textContent = 'Send Reset Link';
          btnSpinner.classList.add('d-none');
        }
      });
    </script>
  </body>
</html>
