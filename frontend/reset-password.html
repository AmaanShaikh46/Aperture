<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aperture.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/bootstrap-overrides.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Reset Password — APERTURE</title>
  </head>
  <body>
    <div id="app">
      <div class="auth-page">
        <div class="auth-brand">
          <i class="bi bi-aperture"></i>
          <h1>APERTURE</h1>
        </div>
        <div class="auth-card card">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Reset Password</h2>
            <p class="text-muted mb-3">Enter your new password below.</p>
            <form id="reset-form">
              <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="password" required autocomplete="new-password" minlength="8" />
                <div class="form-text">Minimum 8 characters.</div>
              </div>
              <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm-password" required autocomplete="new-password" minlength="8" />
              </div>
              <div id="reset-error" class="alert alert-danger d-none" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100 btn-lg" id="reset-btn">
                <span id="reset-btn-text">Reset Password</span>
                <span id="reset-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>
            <div class="auth-links">
              <a href="login.html">Back to sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { auth } from './js/services/auth-service.js';
      import { initTheme, showToast } from './js/utils.js';
      import { USE_MOCK_API } from './js/config.js';

      initTheme();

      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');
      const btn = document.getElementById('reset-btn');
      const btnText = document.getElementById('reset-btn-text');
      const btnSpinner = document.getElementById('reset-btn-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('d-none');

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (password !== confirm) {
          errorEl.textContent = 'Passwords do not match.';
          errorEl.classList.remove('d-none');
          return;
        }

        btn.disabled = true;
        btnText.textContent = 'Resetting...';
        btnSpinner.classList.remove('d-none');

        try {
          if (USE_MOCK_API) {
            showToast('Password reset (mock mode)', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1000);
            return;
          }
          await auth.updatePassword(password);
          showToast('Password updated successfully.', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        } catch (err) {
          errorEl.textContent = err.message || 'Could not reset password.';
          errorEl.classList.remove('d-none');
          btn.disabled = false;
          btnText.textContent = 'Reset Password';
          btnSpinner.classList.add('d-none');
        }
      });
    </script>
  </body>
</html>
