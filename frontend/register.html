<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aperture.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/bootstrap-overrides.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Create Account — APERTURE</title>
  </head>
  <body>
    <div id="app">
      <div class="auth-page">
        <div class="auth-brand">
          <i class="bi bi-aperture"></i>
          <h1>APERTURE</h1>
        </div>
        <div class="auth-card card">
          <div class="card-body p-4">
            <h2 class="h4 mb-3">Create Account</h2>
            <form id="register-form">
              <div class="mb-3">
                <label for="displayName" class="form-label">Display Name</label>
                <input type="text" class="form-control" id="displayName" required autocomplete="name" />
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required autocomplete="username" />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required autocomplete="email" />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required autocomplete="new-password" minlength="8" />
                <div class="form-text">Minimum 8 characters.</div>
              </div>
              <div id="register-error" class="alert alert-danger d-none" role="alert"></div>
              <button type="submit" class="btn btn-primary w-100 btn-lg" id="register-btn">
                <span id="register-btn-text">Create Account</span>
                <span id="register-btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </form>
            <div class="auth-links">
              <span>Already have an account? <a href="login.html">Sign in</a></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { auth } from './js/services/auth-service.js';
      import { initTheme, showToast } from './js/utils.js';
      import { USE_MOCK_API } from './js/config.js';

      initTheme();

      const form = document.getElementById('register-form');
      const errorEl = document.getElementById('register-error');
      const btn = document.getElementById('register-btn');
      const btnText = document.getElementById('register-btn-text');
      const btnSpinner = document.getElementById('register-btn-spinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('d-none');
        btn.disabled = true;
        btnText.textContent = 'Creating account...';
        btnSpinner.classList.remove('d-none');

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const displayName = document.getElementById('displayName').value;
        const username = document.getElementById('username').value;

        try {
          if (USE_MOCK_API) {
            showToast('Account created (mock mode)', 'success');
            setTimeout(() => { window.location.href = 'verify.html'; }, 500);
            return;
          }
          await auth.signUp(email, password, { displayName, username });
          window.location.href = 'verify.html';
        } catch (err) {
          errorEl.textContent = err.message || 'Registration failed. Please try again.';
          errorEl.classList.remove('d-none');
          btn.disabled = false;
          btnText.textContent = 'Create Account';
          btnSpinner.classList.add('d-none');
        }
      });
    </script>
  </body>
</html>
